<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input and Output Devices Drag & Drop</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:20px}
h1{text-align:center;color:#1e3a5f}
p{text-align:center}
#devices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px auto;max-width:1000px}
.device{background:#2b6cb0;color:#fff;padding:12px 16px;border-radius:8px;cursor:grab;font-weight:bold}
.categories{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.dropzone{width:300px;min-height:320px;background:#fff;border:3px dashed #999;border-radius:10px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.dropzone h2{text-align:center;margin-top:0}
.correct{background:#38a169!important}
.wrong{background:#e53e3e!important}
#feedback{text-align:center;font-size:1.2em;font-weight:bold;margin-top:20px}
button{display:block;margin:20px auto;padding:12px 24px;font-size:1em}
.logo-container{
    text-align:center;
    margin:15px 0 25px 0;
}

.school-logo{
    width:120px;
    max-width:90%;
    height:auto;
	border-width:2px;
	border-style:solid;
	border-color:dark blue;
}
</style>
</head>
<body>
<h1>Input, Output or Both?</h1>
<div class="logo-container">
	<img src="jhn_logo.jpg" alt="School Logo" class="school-logo">
</div>
<p>Drag each device into the correct category.</p>
<div id="devices"></div>
<div class="categories">
<div class="dropzone" data-category="input"><h2>Input Devices</h2></div>
<div class="dropzone" data-category="output"><h2>Output Devices</h2></div>
<div class="dropzone" data-category="both"><h2>Both Input & Output</h2></div>
</div>
<button onclick="checkAnswers()">Check Answers</button>
<div id="feedback"></div>
<script>
const items=[
{name:'Keyboard',cat:'input'},
{name:'Mouse',cat:'input'},
{name:'Microphone',cat:'input'},
{name:'Scanner',cat:'input'},
{name:'Webcam',cat:'input'},
{name:'Monitor',cat:'output'},
{name:'Printer',cat:'output'},
{name:'Projector',cat:'output'},
{name:'Speakers',cat:'output'},
{name:'Plotter',cat:'output'},
{name:'Touchscreen',cat:'both'},
{name:'Headset',cat:'both'},
{name:'VR Headset',cat:'both'},
{name:'Interactive Whiteboard',cat:'both'}
];
const devices=document.getElementById('devices');
items.sort(()=>Math.random()-0.5).forEach((item,i)=>{
 const div=document.createElement('div');
 div.className='device';
 div.textContent=item.name;
 div.draggable=true;
 div.id='d'+i;
 div.dataset.category=item.cat;
 div.addEventListener('dragstart',e=>e.dataTransfer.setData('text',div.id));
 devices.appendChild(div);
});

document.querySelectorAll('.dropzone').forEach(zone=>{
 zone.addEventListener('dragover',e=>e.preventDefault());
 zone.addEventListener('drop',e=>{
  e.preventDefault();
  const id=e.dataTransfer.getData('text');
  zone.appendChild(document.getElementById(id));
 });
});

function checkAnswers(){
 let score=0;
 let total=items.length;
 document.querySelectorAll('.device').forEach(d=>{
  d.classList.remove('correct','wrong');
  const parent=d.parentElement.dataset.category;
  if(parent===d.dataset.category){d.classList.add('correct');score++;}
  else{d.classList.add('wrong');}
 });
 document.getElementById('feedback').textContent=`Score: ${score} / ${total}`;
}
</script>
</body>
</html>
